name: 每日收稿数据更新

on:
  schedule:
    # 每天 UTC 18:00 = 北京时间凌晨 2:00
    - cron: "0 18 * * *"
  workflow_dispatch: # 支持手动触发

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm ci --omit=dev || npm install --omit=dev

      - name: 抓取公众号收稿动态（监测）
        run: node src/monitor-main.js --output ./verify-out --batch 2 --delay 2500
        continue-on-error: true

      - name: 生成最新编辑数据
        run: node src/build-editors.js --out ./editors-latest.json

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 每日自动更新收稿数据 $(date +'%Y-%m-%d')"
          git push
