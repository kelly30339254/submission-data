name: 每日收稿数据更新

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --omit=dev

      - name: 抓取公众号收稿动态
        run: node src/monitor-main.js --output ./verify-out --batch 2 --delay 2500
        continue-on-error: true

      - name: 生成最新编辑数据
        run: node src/build-editors.js --out ./editors-latest.json

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 每日自动更新收稿数据 $(date +'%Y-%m-%d')"
          git push
